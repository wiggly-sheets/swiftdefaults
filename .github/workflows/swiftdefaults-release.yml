name: SwiftDefaults Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build release binary
        run: swift build -c release

      - name: Package .app bundle
        run: |
          APP=SwiftDefaults
          BUILD_DIR=.build/release
          APP_BUNDLE=$APP.app
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp "$BUILD_DIR/$APP" "$APP_BUNDLE/Contents/MacOS/$APP"
          sed \
            -e 's/$$(EXECUTABLE_NAME)/'"$APP"'/g' \
            -e 's/$$(PRODUCT_BUNDLE_IDENTIFIER)/com.wigglysheets.'"$APP"'/g' \
            -e 's/$$(PRODUCT_NAME)/'"$APP"'/g' \
            "$APP/Info.plist" > "$APP_BUNDLE/Contents/Info.plist"
          cp "$APP/Resources/AppIcon.icns" "$APP_BUNDLE/Contents/Resources/"

      - name: Create DMG
        run: |
          APP=SwiftDefaults.app
          DMG=SwiftDefaults.dmg
          hdiutil create -volname "SwiftDefaults" -srcfolder "$APP" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwiftDefaults.dmg
            SwiftDefaults.dmg.sha256
          generate_release_notes: true