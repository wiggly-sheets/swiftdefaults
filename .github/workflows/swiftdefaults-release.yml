# Release pipeline for SwiftDefaults.
# Gate order: tag -> tests -> artifacts -> verify -> notes -> publish.
# Nothing is published unless `make test` passes and the built bundle ships the
# tweak registry. The packaging lives in the Makefile: `make app` assembles and
# signs the bundle, `make release-artifacts` builds the disk image and its
# checksum file, `make verify` checks the result.

name: SwiftDefaults Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version from tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Tag must sit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on origin/main - cut the tag from the main branch tip"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build the release artifacts
        run: make release-artifacts VERSION=${{ steps.meta.outputs.version }}

      - name: Verify bundle
        run: make verify VERSION=${{ steps.meta.outputs.version }}

      - name: Write the release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh notes "$VERSION" > release-notes.md
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat release/*.sha256
            echo '```'
          } >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SwiftDefaults ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.dmg
            release/*.sha256
          fail_on_unmatched_files: true
