name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Package .app bundle (arm64)
        run: make app-arm

      - name: Package .app bundle (x86_64)
        run: make app-intel

      # Checks both bundles: the registry, the icon, the app root, the
      # architecture of each one and the signature, so the same gate runs locally.
      - name: Verify bundles
        run: make verify
